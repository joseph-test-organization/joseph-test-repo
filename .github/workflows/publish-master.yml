name: Publish Release NPM Packages With Pnpm

on:
  release:
    types: [published]

env:
  IMAGE_NAME: "ghcr.io/${{ github.repository_owner }}/joseph-chat"

jobs:
  test-pnpm-publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Register npm token
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Verify npm authentication
        run: npm whoami

      - name: Check out code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install and build packages
        run: pnpm install

      - name: Verify pnpm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm whoami

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish -r --no-git-checks

  build-docker-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get image tag
        id: tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          IMAGE_TAG="${{ env.IMAGE_NAME }}:${VERSION#v}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "[amd64] Image tag will be: ${IMAGE_TAG}"

      - name: Build and push by digest (linux/amd64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            GITHUB_SHA=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,push=true
          provenance: false

      - name: Export digest and tag
        run: |
          mkdir -p /tmp/docker-meta
          echo "${{ steps.build.outputs.digest }}" > /tmp/docker-meta/digest.txt
          echo "${{ steps.tag.outputs.image_tag }}" > /tmp/docker-meta/tag.txt
          echo "[amd64] Digest: ${{ steps.build.outputs.digest }}"
          echo "[amd64] Tag:    ${{ steps.tag.outputs.image_tag }}"

      - name: Upload docker meta artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-meta-amd64
          path: /tmp/docker-meta/

  build-docker-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest (linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            GITHUB_SHA=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,push=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/docker-meta
          echo "${{ steps.build.outputs.digest }}" > /tmp/docker-meta/digest.txt
          echo "[arm64] Digest: ${{ steps.build.outputs.digest }}"

      - name: Upload docker meta artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-meta-arm64
          path: /tmp/docker-meta/

  create-docker-manifest:
    needs: [build-docker-amd64, build-docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download amd64 meta
        uses: actions/download-artifact@v4
        with:
          name: docker-meta-amd64
          path: /tmp/amd64-meta

      - name: Download arm64 meta
        uses: actions/download-artifact@v4
        with:
          name: docker-meta-arm64
          path: /tmp/arm64-meta

      - name: Create and push multi-arch manifest
        run: |
          TAG=$(cat /tmp/amd64-meta/tag.txt)
          AMD64_DIGEST=$(cat /tmp/amd64-meta/digest.txt)
          ARM64_DIGEST=$(cat /tmp/arm64-meta/digest.txt)
          echo "[manifest] Tag:         ${TAG}"
          echo "[manifest] amd64 digest: ${AMD64_DIGEST}"
          echo "[manifest] arm64 digest: ${ARM64_DIGEST}"
          echo "[manifest] Creating manifest..."
          docker buildx imagetools create \
            -t "${TAG}" \
            "${{ env.IMAGE_NAME }}@${AMD64_DIGEST}" \
            "${{ env.IMAGE_NAME }}@${ARM64_DIGEST}"
          echo "[manifest] Done"

      - name: Inspect manifest
        run: |
          TAG=$(cat /tmp/amd64-meta/tag.txt)
          echo "[manifest] Inspecting ${TAG}"
          docker buildx imagetools inspect "${TAG}"

  append-docker-tag-to-release:
    needs: [create-docker-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download amd64 meta artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-meta-amd64
          path: /tmp/amd64-meta

      - name: Build release body
        id: build-body
        run: |
          TAG=$(cat /tmp/amd64-meta/tag.txt)
          echo "[release] Appending tag to release: ${TAG}"
          {
            echo "body<<EOF"
            echo "### Docker Image"
            echo ""
            echo "  - \`${TAG}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Append docker tag to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          append_body: true
          body: ${{ steps.build-body.outputs.body }}
